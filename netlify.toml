[build]
publish = "."

[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "no-cache"

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200

[[redirects]]
from = "/login"
to = "/login.html"
status = 200

[[redirects]]
from = "/signup"
to = "/signup.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200